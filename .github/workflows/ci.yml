name: CI

on:
  push:
    branches: [main]
  pull_request:
    paths-ignore:
      - 'plans/**'
      - '*.md'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l cmd internal)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"; echo "$unformatted"; exit 1
          fi

      - name: vet
        run: go vet ./...

      # TestSortieValidate prefers an engine binary and skips without one.
      # CI deliberately does not install one: it would run whatever engine
      # is on PATH, and the stock engine rejects the shipped workflows for
      # the wrong reason.
      - name: test
        run: go test ./...

  # Default-engine acceptance: the main scenario, the fallback scenario
  # and the connected-hub scenario. The upstream engine runs separately
  # below.
  acceptance-default:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/jigz
          key: engine-binaries-v1
      - name: acceptance (default engine)
        run: go test -tags acceptance -count=1 -timeout 14m -run '^TestAcceptance' -skip '^TestAcceptanceUpstreamEngine$' -v ./cmd/jig

  # Upstream-engine acceptance: the issues scenario on sortie-ai/sortie,
  # with the prs loop offline for its missing github-pr tracker.
  acceptance-upstream:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/jigz
          key: engine-binaries-v1
      - name: acceptance (upstream engine)
        run: go test -tags acceptance -count=1 -timeout 14m -run '^TestAcceptanceUpstreamEngine$' -v ./cmd/jig

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath ./...

  # Contract tests against both pinned engine releases, in parallel with
  # check and acceptance. The engines are cached between runs; a miss
  # downloads the verified releases.
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/jigz
          key: engine-binaries-v1
      - name: contract
        run: go test -tags contract ./...
