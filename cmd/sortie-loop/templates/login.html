{{define "login"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in - Sortie Central</title>
<style>{{template "styles"}}</style>
</head>
<body>
<div class="loginwrap">
<form class="card" method="post" action="/login">
  <h1>{{template "icon-hex"}} Sortie Central</h1>
  <p class="sub">Sign in to continue.</p>
  <input type="hidden" name="next" value="{{.Next}}">
  <label class="f">Password<input type="password" name="password" autocomplete="current-password" autofocus required></label>
  <div class="ferr" role="alert" style="min-height:1.5rem">{{.Error}}</div>
  <div class="row"><button class="primary" type="submit">Sign in</button>{{if .PublicRead}}<a class="btn" href="/">Continue read-only</a>{{end}}</div>
</form>
</div>
</body>
</html>
{{end}}
